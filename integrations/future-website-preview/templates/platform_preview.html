<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gate CrossEx Cloud Preview</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0d1117;color:#e6edf3}body{max-width:980px;margin:0 auto;padding:32px 20px}h1{font-size:26px}h2{font-size:18px;margin-top:28px}.notice{border:1px solid #d29922;background:#2b2108;padding:14px;border-radius:8px;color:#f2cc60}.card{border:1px solid #30363d;background:#161b22;padding:18px;border-radius:10px;margin-top:18px}label{display:block;margin:10px 0 4px;color:#8b949e}input,select,button{box-sizing:border-box;padding:10px;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:#e6edf3}input,select{width:100%}button{margin-top:14px;background:#f0883e;color:#0d1117;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}pre{white-space:pre-wrap;word-break:break-word;background:#010409;padding:14px;border-radius:8px;border:1px solid #30363d}.hidden{display:none}@media(max-width:640px){.grid{grid-template-columns:1fr}}</style></head><body>
<h1>Gate CrossEx Cloud Preview</h1><div class="notice">仅预览环境：Live Writes 已关闭。本页面不能确认订单、不能提交订单、不能录入交易所凭证。</div>
<section id="login" class="card"><h2>管理员登录</h2><label for="password">独立 Preview 管理员密码</label><input id="password" type="password" autocomplete="current-password"><button id="loginButton">登录</button><pre id="loginResult"></pre></section>
<main id="console" class="hidden"><section class="card"><h2>Canary 状态</h2><button id="refreshButton">刷新全部状态</button><pre id="status"></pre></section><section class="card"><h2>TARGET Shadow 观察器</h2><p>只读展示新平台 Shadow 计划与旧 Bridge 路由证据的比较结果。</p><pre id="shadowStatus"></pre></section><section class="card"><h2>最近 Shadow 比较</h2><pre id="shadowComparisons"></pre></section><section class="card"><h2>创建订单预览</h2><div class="grid"><div><label>Symbol</label><input id="symbol" value="BINANCE_FUTURE_BTC_USDT"></div><div><label>Side</label><select id="side"><option>BUY</option><option>SELL</option></select></div><div><label>Quantity</label><input id="quantity" value="0.001"></div><div><label>Limit Price</label><input id="price" value="64000"></div></div><button id="previewButton">生成不可执行预览</button><pre id="preview"></pre></section></main>
<script>let csrfToken='';const out=(id,value)=>document.getElementById(id).textContent=JSON.stringify(value,null,2);async function auth(){const r=await fetch('/api/platform-preview/auth');const d=await r.json();if(d.authenticated){csrfToken=d.csrf_token;document.getElementById('login').classList.add('hidden');document.getElementById('console').classList.remove('hidden');await refresh();}}async function refresh(){const [status,shadow,comparisons]=await Promise.all([fetch('/api/platform-preview/status'),fetch('/api/platform-preview/shadow-status'),fetch('/api/platform-preview/shadow-comparisons')]);out('status',await status.json());out('shadowStatus',await shadow.json());out('shadowComparisons',await comparisons.json());}document.getElementById('loginButton').onclick=async()=>{const r=await fetch('/platform-preview/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();out('loginResult',d);if(r.ok){csrfToken=d.csrf_token;await auth();}};document.getElementById('refreshButton').onclick=refresh;document.getElementById('previewButton').onclick=async()=>{const body={symbol:document.getElementById('symbol').value,side:document.getElementById('side').value,type:'LIMIT',timeInForce:'GTC',quantity:document.getElementById('quantity').value,price:document.getElementById('price').value,reduceOnly:false};const r=await fetch('/api/platform-preview/order-previews',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify(body)});out('preview',await r.json());};auth();</script></body></html>
