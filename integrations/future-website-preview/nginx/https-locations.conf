    location = /platform-preview/login {
        limit_req zone=platform_preview_login burst=2 nodelay;
        proxy_pass http://127.0.0.1:8506/platform-preview/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_flags ~ secure httponly samesite=lax;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        client_max_body_size 16k;
    }

    location ^~ /platform-preview {
        limit_req zone=platform_preview_page burst=10 nodelay;
        proxy_pass http://127.0.0.1:8506;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_flags ~ secure httponly samesite=lax;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        client_max_body_size 16k;
    }

    location ^~ /api/platform-preview/ {
        limit_req zone=platform_preview_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8506;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_flags ~ secure httponly samesite=lax;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        client_max_body_size 16k;
    }
